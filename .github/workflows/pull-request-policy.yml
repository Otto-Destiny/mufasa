name: Pull request policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        shell: bash
        run: |
          pattern='^(feat|fix|docs|chore|refactor|test|ci|data|model)/[a-z0-9]+(-[a-z0-9]+)*$'
          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo "::error::Branch '$BRANCH_NAME' must use an approved prefix and a lowercase name (for example, feat/offline-search)."
            exit 1
          fi
          echo "Branch name accepted: $BRANCH_NAME"
