[project]
name = "mufasa-app"
version = "0.1.0"
description = "MUFASA application layer — laptop-local orchestrator, resource governor, offline API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "mufasa-retrieval",
]

[project.optional-dependencies]
test = ["httpx>=0.27"]

[project.scripts]
mufasa-serve = "mufasa_app.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mufasa_app"]
