[project]
name = "mufasa"
version = "0.1.0"
description = "MUFASA — offline African scientific reasoning on a consumer laptop"
requires-python = ">=3.11"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["03-retrieval", "04-application/backend"]

[tool.uv.sources]
mufasa-retrieval = { workspace = true }
mufasa-app = { workspace = true }

[dependency-groups]
dev = [
    "mufasa-retrieval",
    "mufasa-app",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["03-retrieval/tests", "04-application/backend/tests"]
markers = [
    "slow: needs a real GGUF model or the Piper voice binary (opt in with -m slow)",
    "packaging: needs a built desktop bundle",
]
filterwarnings = ["error::DeprecationWarning:mufasa_.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
