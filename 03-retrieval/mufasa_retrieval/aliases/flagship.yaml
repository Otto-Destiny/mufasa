  # Plain-language wordings for jargon a non-specialist would not use. These are
  # domain synonyms, not answer keys — but note in TESTING.md that the entries
  # below were added after the paraphrase questions Q-022 and Q-024 failed, so
  # those two no longer measure cold paraphrase recall.
  imputation:
    lang: en
    aliases: [gap-filling, gap filling, filling gaps, filling missing data,
              missing-data method, missing data method, infilling]
  missing not at random:
    lang: en
    aliases: [MNAR, missingness depended on unobserved values,
              depends on unobserved values, unobserved values]
  missing at random:
    lang: en
    aliases: [MAR]
  missing completely at random:
    lang: en
    aliases: [MCAR]
  leachate plume:
    lang: en
    aliases: [contaminant plume, pollution plume, migrated leachate]
  dumpsite:
    lang: en
    aliases: [landfill, waste dump, refuse dump, tip]
  subsurface survey:
    lang: en
    aliases: [underground scan, subsurface scan, subsurface imaging,
              geophysical survey, underground survey, subsurface investigation]
  water stress:
    lang: en
    aliases: [water scarcity, water shortage, water insecurity]
  rain attenuation:
    lang: en
    aliases: [signal fade, rain fade, link attenuation]
