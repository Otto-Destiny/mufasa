# Alias list for the flagship domain.
#
# Without it an English-only search misses much of the corpus: a question asked
# with a local name, an acronym, or a species' common name never reaches the
# claim that answers it. Hand-written, versioned with the corpus, and expanded
# whenever the evaluation set turns up a miss.
#
# `canonical` is the name as it appears in the corpus entity table.

version: aliases-v1
entities:
  Clarias gariepinus:
    lang: la
    aliases: [African catfish, African sharptooth catfish, catfish, aro, tarwada]
  fenthion:
    lang: en
    aliases: [Baytex, Lebaycid, organophosphate pesticide fenthion]
  rice husk ash:
    lang: en
    aliases: [RHA, rice hull ash, rice-husk ash]
  Vernonia amygdalina:
    lang: la
    aliases: [bitter leaf, onugbu, ewuro, etidot, chusar-doki]
