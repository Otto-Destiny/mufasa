[project]
name = "mufasa-retrieval"
version = "0.1.0"
description = "MUFASA retrieval layer — offline evidence store, two-axis coverage gate, citation validator"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "PyYAML>=6.0",
]

[project.scripts]
mufasa-build = "mufasa_retrieval.cli:build_main"
mufasa-eval = "mufasa_retrieval.cli:eval_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mufasa_retrieval"]
